media:
  - name: uploads
    label: Uploaded Images
    input: uploads
    output: uploads
    extensions: [jpg, jpeg, png, webp]
    categories: [image]
    rename: safe

content:
  - name: site
    label: Basic Site Content
    type: file
    path: content/site.json
    format: json
    fields:
      - name: hero
        label: Hero Section
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: headline_1, label: Headline Line 1, type: string }
          - { name: headline_2, label: Headline Line 2, type: string }
          - { name: headline_3, label: Headline Line 3, type: string }
          - { name: subtitle, label: Subtitle, type: text }
          - { name: fact_1_value, label: Fact 1 Value, type: string }
          - { name: fact_1_label, label: Fact 1 Label, type: string }
          - { name: fact_2_value, label: Fact 2 Value, type: string }
          - { name: fact_2_label, label: Fact 2 Label, type: string }
          - { name: fact_3_value, label: Fact 3 Value, type: string }
          - { name: fact_3_label, label: Fact 3 Label, type: string }
          - { name: fact_4_value, label: Fact 4 Value, type: string }
          - { name: fact_4_label, label: Fact 4 Label, type: string }
      - name: sessions
        label: Dates & Pricing
        type: object
        fields:
          - { name: session_one_start, label: Session One Start, type: string }
          - { name: session_one_end, label: Session One End, type: string }
          - { name: session_two_start, label: Session Two Start, type: string }
          - { name: session_two_end, label: Session Two End, type: string }
          - { name: weekly_price, label: Weekly Price, type: string }
          - { name: full_season_price, label: Full Season Price, type: string }
          - { name: care_price, label: Care Price, type: string }
      - name: photos
        label: Photo Section Text
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: headline, label: Headline, type: string }
          - { name: headline_emphasis, label: Headline Emphasis, type: string }
          - { name: body, label: Body, type: text }
          - { name: callout_title, label: Callout Title, type: string }
          - { name: callout_body, label: Callout Body, type: text }
      - name: contact
        label: Contact & Social Links
        type: object
        fields:
          - { name: email, label: Contact Email, type: string }
          - { name: instagram, label: Instagram URL, type: string }
          - { name: facebook, label: Facebook URL, type: string }
      - name: faq
        label: FAQ
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{question}"
        fields:
          - { name: question, label: Question, type: string }
          - { name: answer, label: Answer, type: text }

  - name: gallery
    label: Photo Albums
    type: file
    path: content/gallery.json
    format: json
    fields:
      - name: albums
        label: Albums
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Album Title
            type: string
          - name: date
            label: Date or Day
            type: string
            default: Day 1
          - name: description
            label: Album Description
            type: text
          - name: show_on_homepage
            label: Feature on homepage
            type: boolean
            default: true
          - name: images
            label: Album Photos
            type: image
            options:
              media: uploads
              path: uploads
              multiple: true
              unique: true
              extensions: [jpg, jpeg, png, webp]

settings:
  content:
    merge: true
  commit:
    templates:
      create: "cms: create {path}"
      update: "cms: update {path}"
      delete: "cms: delete {path}"
      rename: "cms: rename {oldPath} to {newPath}"
