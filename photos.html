<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kosher Culinary Camp Photo Album — Chabad of Troy</title>
  <meta name="description" content="View the Kosher Culinary Camp photo album from Chabad of Troy. Camp photos, kitchen moments, trips, activities, and summer memories.">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="https://camp.jewishtroy.com/photos.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Kosher Culinary Camp Photo Album">
  <meta property="og:description" content="View the Kosher Culinary Camp photo album from Chabad of Troy.">
  <meta property="og:image" content="https://myalbum.com/album/tDxQuxC32NCQgP/cover?size=1000">
  <meta property="og:url" content="https://camp.jewishtroy.com/photos.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Kosher Culinary Camp Photo Album">
  <meta name="twitter:description" content="View the Kosher Culinary Camp photo album from Chabad of Troy.">
  <meta name="twitter:image" content="https://myalbum.com/album/tDxQuxC32NCQgP/cover?size=1000">
  <link rel="preconnect" href="https://myalbum.com">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #FFF5E8; color: #1C1C2E; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: flex; flex-direction: column; }
    .topbar {
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px clamp(16px, 4vw, 36px);
      background: #1C1C2E;
      color: #fff;
    }
    .brand { font-weight: 900; color: #fff; text-decoration: none; letter-spacing: -.02em; }
    .brand em { color: #F5C842; font-style: normal; }
    .back {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 9px 15px;
      border-radius: 999px;
      background: #D64B2A;
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      text-decoration: none;
    }
    .album-shell { flex: 1; padding: clamp(12px, 2.5vw, 24px); }
    #myalbumEmbed {
      min-height: calc(100vh - 110px);
      border-radius: 22px;
      overflow: auto;
      background: #fff;
      border: 2px solid #E8DDD0;
    }
    .fallback {
      display: block;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 18px;
      background: #fff;
    }
    .fallback img { display: block; width: 100%; height: auto; }
    .fallback-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 110px);
      gap: 18px;
      padding: 24px;
      text-align: center;
      color: #6B6470;
    }
    .fallback-wrap p { max-width: 620px; margin: 0; line-height: 1.6; }
    @media (max-width: 640px) {
      .topbar { min-height: 56px; padding: 9px 12px; }
      .brand { font-size: 15px; }
      .back { min-height: 36px; padding: 8px 12px; font-size: 11px; }
      .album-shell { padding: 10px; }
      #myalbumEmbed { min-height: calc(100vh - 76px); border-radius: 16px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><em>Kosher</em> Culinary Camp</a>
    <a class="back" href="index.html">Back to Site</a>
  </header>
  <main class="album-shell">
    <div id="myalbumEmbed" aria-label="Kosher Culinary Camp photo album"></div>
    <noscript>
      <a class="fallback" target="_blank" rel="noopener" href="https://myalbum.com/album/tDxQuxC32NCQgP/">
        <img width="1000" src="https://myalbum.com/album/tDxQuxC32NCQgP/cover?size=1000" alt="Kosher Culinary Camp photo album cover">
      </a>
    </noscript>
  </main>
  <script>
    var albumKey = 'tDxQuxC32NCQgP';
    var holderId = 'myalbumEmbed';
    var holder = document.getElementById(holderId);

    function showAlbumFallback() {
      holder.innerHTML = '<div class="fallback-wrap"><a class="fallback" target="_blank" rel="noopener" href="https://myalbum.com/album/tDxQuxC32NCQgP/"><img width="1000" src="https://myalbum.com/album/tDxQuxC32NCQgP/cover?size=1000" alt="Kosher Culinary Camp photo album cover"></a><p>The full album is hosted on MyAlbum. Open it to view all camp photos.</p></div>';
    }

    function initMyAlbum() {
      if (!window.myalbum || !window.myalbum.album) return;
      var album = new window.myalbum.album.Create(holderId);
      album.load(albumKey);
    }

    var script = document.createElement('script');
    script.src = 'https://myalbum.com/res/package/js/api-album.js?hl=en';
    script.async = true;
    script.onerror = showAlbumFallback;
    document.body.appendChild(script);
    window.setTimeout(function() {
      if (holder.children.length === 0) showAlbumFallback();
    }, 3500);
  </script>
</body>
</html>
