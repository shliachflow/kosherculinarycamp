<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kosher Culinary Camp — Registration 2026</title>
  <meta name="description" content="Register for Kosher Culinary Camp 2026 at Chabad of Troy." />
  <meta name="theme-color" content="#1C1C2E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: 'DM Sans', system-ui, sans-serif; background: #FFF2D6; color: #1C1C2E; }
    body { display: flex; flex-direction: column; }
    .topbar {
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px clamp(16px, 4vw, 36px);
      background: #1C1C2E;
      color: #fff;
    }
    .brand { display: inline-flex; align-items: center; gap: 10px; min-width: 0; font-weight: 800; }
    .brand img { width: 38px; height: 38px; border-radius: 8px; object-fit: cover; }
    .brand span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand em { color: #F5C842; font-style: normal; }
    .back {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 9px 15px;
      border-radius: 999px;
      background: #F5C842;
      color: #1C1C2E;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      text-decoration: none;
    }
    .form-wrap { flex: 1; min-height: calc(100vh - 62px); position: relative; }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
    @media (max-width: 520px) {
      .topbar { min-height: 58px; padding: 9px 12px; }
      .brand { font-size: 14px; }
      .brand img { width: 34px; height: 34px; }
      .back { padding: 8px 12px; font-size: 11px; }
      .form-wrap { min-height: calc(100vh - 58px); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Back to Kosher Culinary Camp home">
      <img src="uploads/kosher-culinary-camp-logo-nav.jpg" alt="">
      <span><em>Kosher</em> Culinary Camp</span>
    </a>
    <a class="back" href="index.html">Back to Site</a>
  </header>
  <main class="form-wrap">
    <iframe src="https://tally.so/r/1AN8Ag?transparentBackground=1" title="Kosher Culinary Camp — Registration 2026"></iframe>
  </main>
</body>
</html>
