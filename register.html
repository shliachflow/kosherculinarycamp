<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kosher Culinary Camp — Registration 2026</title>
    <meta name="description" content="Register for Kosher Culinary Camp 2026 at Chabad of Troy.">
    <link rel="canonical" href="https://camp.jewishtroy.com/register.html">
    <script async src="https://tally.so/widgets/embed.js"></script>
    <style>
      :root {
        --navy: #1C1C2E;
        --red: #D64B2A;
        --yellow: #F5C842;
        --white: #FFFFFF;
        --border: #E8DDD0;
      }

      * { box-sizing: border-box; }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #FEF7EC;
        color: var(--navy);
        font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      a { color: inherit; text-decoration: none; }

      .form-nav {
        min-height: 64px;
        background: var(--navy);
        color: var(--white);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 10px clamp(16px, 4vw, 36px);
        box-shadow: 0 4px 24px rgba(0,0,0,.18);
        position: relative;
        z-index: 2;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 900;
        letter-spacing: -.02em;
        white-space: nowrap;
      }

      .brand img {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        object-fit: cover;
      }

      .brand em {
        color: var(--yellow);
        font-style: normal;
      }

      .form-links {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      .form-links a { color: rgba(255,255,255,.78); }
      .form-links a:hover { color: var(--white); }

      .form-links .primary {
        background: var(--red);
        color: var(--white);
        border-radius: 999px;
        padding: 10px 16px;
      }

      .frame-wrap {
        flex: 1;
        min-height: 0;
        padding: clamp(10px, 2vw, 18px);
      }

      iframe {
        width: 100%;
        height: 100%;
        min-height: calc(100vh - 92px);
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--white);
      }

      @media (max-width: 760px) {
        .form-nav {
          align-items: flex-start;
          flex-direction: column;
          gap: 10px;
        }

        .form-links {
          width: 100%;
          gap: 10px;
          overflow-x: auto;
          padding-bottom: 2px;
        }

        .form-links a {
          flex: 0 0 auto;
        }

        iframe {
          border-radius: 14px;
          min-height: calc(100vh - 124px);
        }
      }
    </style>
  </head>
  <body>
    <nav class="form-nav" aria-label="Site navigation">
      <a class="brand" href="index.html">
        <img src="uploads/kosher-culinary-camp-logo-nav.jpg" alt="">
        <span><em>Kosher</em> Culinary Camp</span>
      </a>
      <div class="form-links">
        <a href="index.html#about">About</a>
        <a href="index.html#sessions">Sessions</a>
        <a href="index.html#faq">FAQ</a>
        <a href="scholarship/">Scholarship</a>
        <a href="index.html" class="primary">Back to Site</a>
      </div>
    </nav>
    <main class="frame-wrap">
      <iframe data-tally-src="https://tally.so/r/jakAqY?transparentBackground=1" width="100%" height="100%" frameborder="0" marginheight="0" marginwidth="0" title="Kosher Culinary Camp — Registration 2026"></iframe>
    </main>
  </body>
</html>
